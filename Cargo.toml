[workspace]
resolver = "2"
members = [
    "crates/strata_earth",
    "examples/strata_earth_golden",
    "examples/earth_preview",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Strata Contributors"]
license = "MIT"
repository = "https://github.com/strataui/earth"
homepage = "https://github.com/strataui/earth"
documentation = "https://docs.rs/strata-earth"
keywords = ["geospatial", "3d", "globe", "tiles", "strata"]
categories = ["graphics", "rendering", "science"]

[workspace.dependencies]
strata-earth = { path = "crates/strata_earth", version = "0.1.2" }
strata-primitives = { version = "0.1.0", path = "../strata/crates/core/strata_primitives" }
strata-style = { version = "0.1.0", path = "../strata/crates/core/strata_style" }
strata-layout = { version = "0.1.0", path = "../strata/crates/core/strata_layout" }
strata-render = { version = "0.1.0", path = "../strata/crates/render/strata_render" }
strata-ui = { version = "0.1.0", path = "../strata/crates/strata" }
