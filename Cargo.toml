[workspace]
resolver = "2"
members = [
    "crates/strata_earth",
    "examples/strata_earth_golden",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Strata Contributors"]
license = "MIT"
repository = "https://github.com/strataui/earth"

[workspace.dependencies]
strata_earth = { path = "crates/strata_earth" }
strata_primitives = { git = "https://github.com/strataui/strata.git" }
strata_style = { git = "https://github.com/strataui/strata.git" }
strata_layout = { git = "https://github.com/strataui/strata.git" }
strata_render = { git = "https://github.com/strataui/strata.git" }
