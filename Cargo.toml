[workspace]
resolver = "2"
members = [
    "crates/strata_earth",
    "examples/strata_earth_golden",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Strata Contributors"]
license = "MIT"
repository = "https://github.com/strataui/earth"
homepage = "https://github.com/strataui/earth"
documentation = "https://docs.rs/strata-earth"
keywords = ["geospatial", "3d", "globe", "tiles", "strata"]
categories = ["graphics", "rendering", "science"]

[workspace.dependencies]
strata_earth = { package = "strata-earth", path = "crates/strata_earth", version = "0.1.0" }
strata_primitives = { version = "0.1.0", path = "../strata/crates/core/strata_primitives" }
strata_style = { version = "0.1.0", path = "../strata/crates/core/strata_style" }
strata_layout = { version = "0.1.0", path = "../strata/crates/core/strata_layout" }
strata_render = { version = "0.1.0", path = "../strata/crates/render/strata_render" }
