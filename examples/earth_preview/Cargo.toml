[package]
name = "earth_preview"
version.workspace = true
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "earth"
description = "Interactive Earth preview example opening a window with pan/orbit/zoom and floating programmatic top-right controls"

[[bin]]
name = "earth"
path = "src/main.rs"

[[bin]]
name = "earth_preview"
path = "src/bin/earth_preview.rs"

[dependencies]
strata_earth = { workspace = true, features = ["widget"] }
strata_layout = { workspace = true }
strata_render = { workspace = true }
strata = { package = "strata-ui", path = "../../../strata/crates/strata" }
strata_platform = { package = "strata-ui-platform", path = "../../../strata/crates/render/strata_platform" }
