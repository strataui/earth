[package]
name = "earth_preview"
version.workspace = true
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "earth"
description = "Interactive Earth preview example opening a window with pan/orbit/zoom and floating programmatic top-right controls"

[[bin]]
name = "earth"
path = "src/main.rs"

[[bin]]
name = "earth_preview"
path = "src/bin/earth_preview.rs"

[dependencies]
strata-earth = { workspace = true, features = ["widget"] }
strata-layout = { workspace = true }
strata-render = { workspace = true }
strata-ui = { workspace = true }
strata-ui-platform = { path = "../../../strata/crates/render/strata_platform" }
