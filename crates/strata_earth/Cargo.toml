[package]
name = "strata-earth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Earth scene plugin: f64 geodesy, tile resolution, and scene assembly over strata_render"

[lib]
name = "strata_earth"
path = "src/lib.rs"

[dependencies]
strata_primitives = { workspace = true }
strata_style = { workspace = true }
strata_layout = { workspace = true }
strata_render = { workspace = true }
flate2 = "1.0"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
